# ─── Organizer social pages ───────────────────────────────────────────────────
# Fills the "Organizer Social" column so a date check is one click instead of a
# hunt. Matched by substring against "<event name> <location>", case-insensitive;
# first hit wins. Recurring series are the events that get rescheduled, and 17
# of them make up ~60% of the sheet, so this short table covers most of it.
#
# The listing site we scrape exposes NO organiser link (organizer: null in its
# structured data), so this cannot be automated from the source — every entry
# below was found and checked by hand on 2026-09-17. When adding one, match on
# something that cannot collide: a venue address beats a generic name.
# ⚠️ "Fairfield Cars and Coffee" on Facebook is a CALIFORNIA page (Journey
# Coffee); the Ohio one is a group, sponsored by Bilstein — hence the group URL.
organizer_social:
  - url: https://www.facebook.com/cincinnaticarsandcoffee
    instagram: circuitcafecincy
    match: ["circuit cafe", "2726 riverside"]
  - url: https://www.facebook.com/ElementEatery/
    instagram: elementeatery
    match: ["cars at madison square", "5350 medpace"]
  - url: https://facebook.com/events/s/southern-indiana-car-coffee/2441859369604401/
    match: ["southern indiana car & coffee", "4809 outer loop"]
  - url: https://www.facebook.com/groups/881422478573528/
    instagram: crestview_carsandcoffee  # from Joel, 2026-09-17: 'Crestview Hills/NKY Cars and Coffee'
    match: ["crestview hills", "2751 dixie"]
  - url: https://www.facebook.com/events/1267308188591932/
    match: ["four bridges cruise"]
  - url: https://www.facebook.com/Lawrenceburgcarsandcoffee/
    match: ["lawrenceburg cars", "68 doughty"]
  - url: https://gravityrally.com/pages/2026-cancer-awareness-rally
    match: ["cancer awareness rally"]
  - url: https://corsarally.com/events/dragon/
    match: ["corsa dragon rally"]
  - url: https://www.facebook.com/p/Cammack-Station-Cruise-In-Friday-Nights-at-Cammack-100071862756345/
    instagram: cammackstation
    match: ["cammack station"]
  # One organisation runs the Friday (Colins Coffee), Saturday (Olentangy) and
  # Sunday (Westerville Starbucks) meets, so one page covers all three series.
  - url: https://www.facebook.com/TheColumbusCarsandCoffee/
    instagram: thecolumbuscarsandcoffee
    match: ["columbus cars", "3650 olentangy", "691 n. cleveland", "691 n cleveland"]
  # Season reported as May 2 – Oct 2 in the Dayton press; listing-site rows on
  # Oct 3 and Oct 24 may be stale — check the group before trusting them.
