  # Sources trusted as automotive even when a title lacks car keywords
  # (club calendars, sanctioning bodies, registration platforms). Matched as a
  # case-insensitive substring against the event's Source name.
  car_dedicated_sources:
  - OVR PCA
  - MotorsportReg
  - TrackRabbit
  - SCCA
  - American Rally
  - Touring rally organizers
  - Regional rallies
categorization:
  # rally = multi-day/destination driving events worth a longer trip (600 mi cap).
  # Bare "cruise"/"tour" removed: they matched every weekly Cruise-In and
  # let Cleveland/Chicago-distance events into the sheet.
  rally_keywords:
  - rally
  - roadrally
  - rallycross
  - stage rally
  - road rally
  - driving tour
  - road trip
  - poker run
  local_keywords:
  - cars and coffee
  - car show
  - meet
  - meetup
  - cruise-in
  - cars & coffee
  - autocross
  - track day
  - concours
discovery:
  facebook_event_queries:
  - site:facebook.com/events (cincinnati OR "Cincinnati, OH") (cars OR "car show" OR "cars and coffee" OR rally OR meet)
  - site:facebook.com/events (Ohio OR "Northern Kentucky" OR NKY) (cars OR "car show" OR "cars and coffee" OR rally)
  - site:facebook.com/events (regional rally OR "driving tour") (ohio OR kentucky OR indiana OR tennessee OR michigan)
sources:
# carsandcoffeeevents.com migrated off WordPress to a Laravel app (confirmed
# 2026-09: /wp-json/ 404s entirely now). Its per-state landing pages are still
# server-rendered and paginate via ?page=N; each linked event page carries a
# full schema.org address, which parse_schema_org_events_from_html() reads.
- type: cars_and_coffee_site
  name: CarsAndCoffeeEvents API (OH/KY/IN)
  url: https://carsandcoffeeevents.com
  states: [ohio, kentucky, indiana]
  max_pages: 6
  bypass_automotive_filter: true
- type: ics
  name: OVR PCA Social Events (ICS)
  url: https://calendar.google.com/calendar/ical/c_a760e8990a957e0b46577b4d91cc8fe42b0e84feb0447077ed79c1fdde24939d%40group.calendar.google.com/public/basic.ics
- type: ics
  name: iCloud Published Calendar (ICS)
  url: webcal://p147-caldav.icloud.com/published/2/MjAyOTg3MDYzMDYyMDI5OBf9ajX0FwLfmy7tt5VOuuB3qsUCkmTmEXtFYEkUfJhPbL01ZnaiaS-7j1aRwxpLpv3Uusg0k-ywiw3A3H9vbBk
  future_only: true
  bypass_automotive_filter: true
  # Joel's curated calendar: every event is included, never distance-dropped.
  # Rows are only removed when they duplicate an existing event (same day+time).
  bypass_distance_filter: true
- type: google_sheet_events_import
  name: Google Sheet Events Import
  tab: Events
- type: facebook_page_events
  name: Facebook Page Events (Graph API sheet/env IDs)
# Scrolls the logged-in Facebook "Most Recent" home feed and harvests event links.
# Opt-in: requires ENABLE_FACEBOOK_SCROLL=1, Playwright, and a saved session in
# FACEBOOK_SESSION_STATE (see README). No-op otherwise, so the default cron is
# unaffected. Discovered events flow through the same automotive/distance/date
# filters as every other source.
- type: facebook_events_scroll
  name: Facebook Feed Scroll
  scrolls: 20          # feed scroll steps (more = deeper history, slower)
  scroll_pause_ms: 2000  # wait between scrolls so lazy-loaded posts render
  max_events: 40       # cap on event pages fetched/parsed per run
- type: serpapi_google_events
  name: Google Events (SerpAPI) [serpapi_google_events]
# Google's dedicated Events engine, aimed at each major metro within the radius.
- type: serpapi_google_events
  name: Google Events - Dayton
  query: car show events near Dayton OH
  location: Dayton, Ohio
- type: serpapi_google_events
  name: Google Events - Columbus
  query: car show events near Columbus OH
  location: Columbus, Ohio
- type: serpapi_google_events
  name: Google Events - Louisville
  query: car show events near Louisville KY
  location: Louisville, Kentucky
- type: serpapi_google_events
  name: Google Events - Lexington
  query: car show events near Lexington KY
  location: Lexington, Kentucky
- type: serpapi_google_events
  name: Google Events - Indianapolis
  query: car show events near Indianapolis IN
  location: Indianapolis, Indiana
- type: facebook_group_events_serpapi
  name: Facebook Group Events (SerpAPI)
- name: FB Events (Cincy keywords)
  type: web_search_facebook_events_serpapi
  query: site:facebook.com/events cincinnati ("car meet" OR "cars and coffee" OR "car
    show" OR "cruise in")
  max_results: 30
- name: FB Events (Ohio + NKY)
  type: web_search_facebook_events_serpapi
  query: site:facebook.com/events ("Cincinnati" OR "Northern Kentucky" OR "Newport"
    OR "Florence") ("cars and coffee" OR "car show" OR "car meet")
  max_results: 30
- name: Eventbrite Cincy
  type: web_search_serpapi
  query: site:eventbrite.com ("Cincinnati" OR "Northern Kentucky") ("cars and coffee" OR "car show" OR "cruise in" OR rally OR "track day" OR autocross) ("within 150 miles" OR Ohio OR Kentucky OR Indiana)
  max_results: 30
- name: Meetup Cincy Cars
  type: web_search_serpapi
  query: site:meetup.com cincinnati (cars OR automotive OR "cars and coffee")
  max_results: 30
- name: Regional rallies
  type: web_search_serpapi
  query: ("rally" OR "road rally" OR roadrally OR rallycross OR "stage rally" OR "driving
    tour" OR "road trip") (ohio OR kentucky OR indiana OR tennessee OR michigan OR
    georgia OR north carolina) ("car" OR "supercar" OR automotive) (2026 OR 2027)
  max_results: 30
- name: SCCA RoadRally + RallyCross
  type: web_search_serpapi
  query: (site:scca.com OR site:cincyscca.com) ("road rally" OR roadrally OR rallycross
    OR "rally cross") (ohio OR indiana OR kentucky) (2026 OR 2027)
  max_results: 30
- name: American Rally Association (SOFR + regional)
  type: web_search_serpapi
  query: (site:americanrallyassociation.org OR site:sneakattackrally.com) ("southern
    ohio forest rally" OR "stage rally" OR "rally") (ohio OR kentucky OR indiana)
    (2026 OR 2027)
  max_results: 30
- name: Touring rally organizers (Corsa/Dynasty/Recharge/RNA/Gridlife/Gravity)
  type: web_search_serpapi
  query: (site:corsarally.com OR site:dynastyautoevents.com OR site:therechargerally.com
    OR site:rallynorthamerica.com OR site:grid.life OR site:gravityrally.com OR site:kingoftheroads.events
    OR site:ridewithrandy.org) (rally OR "driving tour" OR "road trip") (ohio OR cincinnati
    OR kentucky OR indiana) (2026 OR 2027)
  max_results: 30
- name: Eventbrite regional autos (SerpAPI)
  type: web_search_serpapi
  query: site:eventbrite.com ("car show" OR "cars and coffee" OR "cruise in" OR autocross
    OR "track day") (Cincinnati OR Dayton OR Columbus OR Indianapolis OR Louisville
    OR "Northern Kentucky")
  max_results: 30
- name: MotorsportReg regional autos
  type: web_search_serpapi
  query: site:motorsportreg.com (autocross OR "track day" OR rally OR hpde OR "cars
    and coffee") (Ohio OR Kentucky OR Indiana)
  max_results: 30
- name: TrackRabbit + SCCA calendar discovery
  type: web_search_serpapi
  query: (site:trackrabbit.com OR site:scca.com) (autocross OR "track day" OR "time
    trial" OR rallycross) (Ohio OR Kentucky OR Indiana)
  max_results: 30
