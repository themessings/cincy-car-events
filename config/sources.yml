  facebook_event_queries:
  - site:facebook.com/events (cincinnati OR "Cincinnati, OH") (cars OR "car show" OR "cars and coffee" OR rally OR meet)
  - site:facebook.com/events (Ohio OR "Northern Kentucky" OR NKY) (cars OR "car show" OR "cars and coffee" OR rally)
  - site:facebook.com/events (regional rally OR "driving tour") (ohio OR kentucky OR indiana OR tennessee OR michigan)
sources:
# carsandcoffeeevents.com migrated off WordPress to a Laravel app (confirmed
# 2026-09: /wp-json/ 404s entirely now). Its per-state landing pages are still
# server-rendered and paginate via ?page=N; each linked event page carries a
# full schema.org address, which parse_schema_org_events_from_html() reads.
- type: cars_and_coffee_site
  name: CarsAndCoffeeEvents API (OH/KY/IN/WV/TN)
  url: https://carsandcoffeeevents.com
  # West Virginia and Tennessee added 2026-09: the existing ~105-mile local
  # radius already reaches into parts of both states, but the direct site
  # crawl previously only visited OH/KY/IN state landing pages, so events
  # there were never discovered even when in range. The existing distance
  # filter (unaffected by this change) still drops anything too far out.
  states: [ohio, kentucky, indiana, west-virginia, tennessee]
  # Confirmed depth needed to fully exhaust each state's current listing
  # (2026-09): Ohio ~23 pages, Indiana ~15, Kentucky ~9. The empty-streak
  # cutoff in collect_cars_and_coffee_events_site() stops each state as soon
  # as it actually runs dry, so this ceiling only matters for Ohio — Kentucky
  # and Indiana finish early regardless and aren't slowed down by it.
  max_pages: 25
  bypass_automotive_filter: true
- type: ics
  name: OVR PCA Social Events (ICS)
  url: https://calendar.google.com/calendar/ical/c_a760e8990a957e0b46577b4d91cc8fe42b0e84feb0447077ed79c1fdde24939d%40group.calendar.google.com/public/basic.ics
- type: ics
  name: iCloud Published Calendar (ICS)
  url: webcal://p147-caldav.icloud.com/published/2/MjAyOTg3MDYzMDYyMDI5OBf9ajX0FwLfmy7tt5VOuuB3qsUCkmTmEXtFYEkUfJhPbL01ZnaiaS-7j1aRwxpLpv3Uusg0k-ywiw3A3H9vbBk
  future_only: true
  bypass_automotive_filter: true
  # Joel's curated calendar: every event is included, never distance-dropped.
  # Rows are only removed when they duplicate an existing event (same day+time).
  bypass_distance_filter: true
# Manually-maintained "Google Sheet Events Import" source (a separate rally
# tracker spreadsheet, tab "Events") disconnected 2026-09-04 at Joel's
# request — no longer in use. It was also the source of a real data bug:
# several multi-day rallies (Southern Ohio Forest Rally, Dynasty Rally 2026,
# Corsa America Spring Rally) had duplicated "Day N" rows shifted by one day
# with wrong years, re-imported unchanged every run since this source was
# never re-verified. If this comes back, that spreadsheet's data needs a
# manual cleanup pass first.
# Hand-verified one-off events with no live crawlable source. Each entry is a
# single concrete date confirmed directly from the host's own page — never a
# recurrence guess. (2026-09: carsandcoffeeevents.com's dead pre-migration
# listing for this host had been silently republishing a stale weekly-guess
# date for months; the real next date was confirmed from a screenshot of the
# host's own Facebook event page.)
- type: manual_events
  name: Manually Verified Events
  # Hand-verified means exactly that: the organiser's own page was read for each
  # date. So neither automatic gate applies. Without these two flags the 2026-09-17
  # run silently dropped four of the seven — Graham Rahal (Zionsville, 110 mi) and
  # Hocking Hills (Logan, 116 mi) fell to the 105-mile cap, and "Trunk or Treat"
  # has no car word in it, so the automotive filter binned it too.
  bypass_distance_filter: true
  bypass_automotive_filter: true
  events:
    - title: Euro Cars and Cocoa
      location: The Cocoa Muse, 600 W Loveland Ave, Loveland, OH 45140-2359
      city_state: Loveland, OH
      date: "2026-09-13"
      start_time: "9:00 AM"
      end_time: "12:00 PM"
      url: https://www.facebook.com/events/3994106880896076/

