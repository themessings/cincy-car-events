name: Cincinnati Car Events Collector

on:
  schedule:
    # GitHub Actions cron is fixed UTC and does not observe daylight saving,
    # so "6am Eastern" is two different UTC times depending on the time of
    # year. Both sets fire every Thursday; the gate job below keeps only the
    # ones whose UTC hour is really Eastern morning today, and skips the rest.
    #
    # The minute is deliberately :20, not :00. GitHub queues scheduled runs on
    # a best-effort basis and the top of the hour is its most congested slot —
    # runs there are delayed by hours or dropped entirely. Past runs of this
    # workflow landed as late as 15:22 UTC for an 11:00 UTC cron.
    #
    # Each DST set has a primary slot and two backstops, because a delayed run
    # is not the worst case — GitHub also DROPS scheduled runs outright, and a
    # dropped one costs a whole week's post with nothing in the Actions tab to
    # show for it. Both failure modes are observed here, on consecutive weeks:
    # 2026-09-10 produced no run at all, and on 2026-09-17 the 10:20 cron was
    # not dispatched until 15:03 — 4h43m late, landing a 6:20am post near noon.
    # Three slots are three chances for one to arrive on time. Whichever lands
    # first does the work and pushes a car-events-bot commit; the gate then
    # no-ops the others, so the extras cost seconds unless they are needed.
    - cron: "20 10 * * 4" # 6:20 AM EDT (roughly Mar-Nov)
    - cron: "20 13 * * 4" # 9:20 AM EDT — backstop
    - cron: "20 16 * * 4" # 12:20 PM EDT — backstop
    - cron: "20 11 * * 4" # 6:20 AM EST (roughly Nov-Mar)
    - cron: "20 14 * * 4" # 9:20 AM EST — backstop
    - cron: "20 17 * * 4" # 12:20 PM EST — backstop
  workflow_dispatch: {}

permissions:
  contents: write

# One collector at a time. A backstop that fires while a badly delayed primary
# is still running would otherwise duplicate the whole run and race it on the
# push; queued behind it instead, its gate sees the finished run's commit and
# skips. Never cancel-in-progress — the run in flight is the one doing the work.
concurrency:
  group: car-events-collector
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Enough history for the "already collected today" check below to
          # find the most recent car-events-bot commit.
          fetch-depth: 50

      - id: check
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run (workflow_dispatch) — always proceeds."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Decide from WHICH cron fired, never from the clock. A scheduled run
          # can start hours after its slot when GitHub is busy, so checking the
          # current hour silently skipped legitimate runs that arrived late.
          CRON="${{ github.event.schedule }}"
          HOUR="$(printf '%s\n' "$CRON" | awk '{print $2}')"
          OFFSET="$(TZ="America/New_York" date +%z)"
          case "$OFFSET" in
            -0400) TODAYS_HOURS="10 13 16" ;; # Eastern Daylight Time
            -0500) TODAYS_HOURS="11 14 17" ;; # Eastern Standard Time
            *)     TODAYS_HOURS="" ;;
          esac

          if [ -z "$TODAYS_HOURS" ]; then
            echo "Unexpected America/New_York offset ${OFFSET} — proceeding rather than skipping a week."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case " ${TODAYS_HOURS} " in
            *" ${HOUR} "*) ;;
            *)
              echo "Eastern is at ${OFFSET}, so today's slots are UTC hours ${TODAYS_HOURS}. This run came from '${CRON}' — the redundant other-DST cron. Skipping."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # A real slot for today. Run only if this week's collection has not
          # already landed — on 2026-09-17 a scheduled run arriving 4h43m late
          # repeated a full 13-minute collection 80 minutes after a manual run
          # had already published the week, because nothing checked.
          # Every successful run rewrites data/source_health.json
          # (it stamps last_run_iso per source) and commits it as car-events-bot,
          # so such a commit dated today is proof the work is done. Anything
          # else — no commit, a failed collector, an unreadable history —
          # proceeds, because a needless re-run costs minutes and a wrongly
          # skipped one costs the week.
          BRANCH="${GITHUB_REF_NAME:-main}"
          git fetch --quiet --depth=50 origin "$BRANCH"
          MIDNIGHT_ET="$(TZ="America/New_York" date -d "today 00:00:00" +%s)"
          LAST_BOT="$(git log -1 --author="car-events-bot" --format=%ct FETCH_HEAD 2>/dev/null || true)"

          if [ -n "$LAST_BOT" ] && [ "$LAST_BOT" -ge "$MIDNIGHT_ET" ]; then
            echo "Already collected today: ${BRANCH} carries a car-events-bot commit from $(date -u -d "@${LAST_BOT}" '+%Y-%m-%d %H:%M UTC'). '${CRON}' is a backstop with nothing to do. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Eastern is at ${OFFSET} and cron '${CRON}' is one of today's slots (UTC hours ${TODAYS_HOURS}); no car-events-bot commit since midnight Eastern — proceeding."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  collect:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-liberation fonts-dejavu-core

      # Facebook feed scroll is opt-in. Set repo variable ENABLE_FACEBOOK_SCROLL=1
      # (Settings → Secrets and variables → Actions → Variables) to pull in the
      # headless browser; otherwise this step is skipped and the cron is unchanged.
      - name: Install Facebook feed-scroll runtime (Playwright)
        if: ${{ vars.ENABLE_FACEBOOK_SCROLL == '1' }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Syntax check collector scripts
        run: |
          python -m py_compile scripts/events_collector.py scripts/validate_runtime_env.py scripts/clean_events.py scripts/generate_weekly_lineup.py

      - name: Run unit tests
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Validate required runtime secrets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          APEX_SPREADSHEET_ID: 1lVpqhmUOQDZywjGeYxgm7ILNXqP3l6Z74pVXw1oKSQ8
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          APEX_FACEBOOK_PAGES_SHEET_ID: 1pol-GLdo3ylizOJ0DG3cDwo9TVClEJ23To7ber0waik
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          APEX_IMPORT_SPREADSHEET_ID: 1xlIu0QIhyNSB1ptnLM6QvSKKYFwFcuVZBl26NMERczk
        run: |
          echo "ℹ️ Facebook token env var name: FACEBOOK_ACCESS_TOKEN"
          if [ -n "${FACEBOOK_ACCESS_TOKEN:-}" ]; then
            echo "ℹ️ FACEBOOK_ACCESS_TOKEN non-empty: yes"
          else
            echo "ℹ️ FACEBOOK_ACCESS_TOKEN non-empty: no"
          fi
          python -u scripts/validate_runtime_env.py

      - name: Run collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          APEX_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          APEX_SPREADSHEET_ID: 1lVpqhmUOQDZywjGeYxgm7ILNXqP3l6Z74pVXw1oKSQ8
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          APEX_FACEBOOK_PAGES_SHEET_ID: 1pol-GLdo3ylizOJ0DG3cDwo9TVClEJ23To7ber0waik
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          APEX_IMPORT_SPREADSHEET_ID: 1xlIu0QIhyNSB1ptnLM6QvSKKYFwFcuVZBl26NMERczk
          # Facebook feed scroll (opt-in). ENABLE_FACEBOOK_SCROLL is a repo variable;
          # FACEBOOK_SESSION_STATE is a secret holding a Playwright storageState JSON
          # (raw or base64) exported from a logged-in browser. Both empty = no-op.
          ENABLE_FACEBOOK_SCROLL: ${{ vars.ENABLE_FACEBOOK_SCROLL }}
          FACEBOOK_SESSION_STATE: ${{ secrets.FACEBOOK_SESSION_STATE }}
          # Optional (only if using a Shared Drive)
          # APEX_SHARED_DRIVE_ID: ${{ secrets.APEX_SHARED_DRIVE_ID }}
        run: |
          set -euo pipefail

          python -u scripts/import_drive_event_screenshots.py \
            --folder-id "${APEX_SCREENSHOT_FOLDER_ID:-13ex_jE_1zAtCbBPcgsVNde8vkPTbA7JS}" \
            --sheet-id "${APEX_IMPORT_SPREADSHEET_ID}"

          python -u scripts/events_collector.py | tee data/collector.log

          # Ensure collector actually ran and produced summary output
          grep -Fq "🚀 Collector starting…" data/collector.log
          grep -Eq "SERPAPI_API_KEY (set\? YES|verified)" data/collector.log
          grep -Fq "🔎 Source summary:" data/collector.log
          grep -Fq "✅ Done." data/collector.log

      - name: Generate weekly lineup (Apex carousel + caption)
        # continue-on-error: a lineup-generation bug should show up as a
        # visibly failed step (unlike relying on tee's exit code, which
        # would otherwise mask a real crash as success) without blocking the
        # collector's own data from being committed and pushed below.
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          APEX_SPREADSHEET_ID: 1lVpqhmUOQDZywjGeYxgm7ILNXqP3l6Z74pVXw1oKSQ8
        run: |
          set -o pipefail
          python -u scripts/generate_weekly_lineup.py | tee data/lineup.log

      - name: Inspect output files
        run: |
          ls -la data
          ls -la data/runs || true
          ls -la lineup_output || true

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-events-output
          path: |
            data/events.csv
            data/events.json
            data/geocode_cache.json
            data/url_cache.json
            data/source_health.json
            data/runs/*.json
            data/collector.log
          if-no-files-found: warn

      - name: Upload weekly lineup artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-weekly-lineup
          path: |
            lineup_output/
            data/lineup.log
          if-no-files-found: warn

      - name: Commit changes (if any)
        run: |
          git config user.name "car-events-bot"
          git config user.email "car-events-bot@users.noreply.github.com"
          git add data/events.csv data/events.json data/runs data/geocode_cache.json data/url_cache.json data/source_health.json

          if git diff --staged --quiet; then
            echo "No data changes detected; skipping commit and push."
            exit 0
          fi

          git commit -m "Update Cincinnati-area car events"

          if ! git pull --rebase origin "${GITHUB_REF_NAME:-main}"; then
            echo "Rebase conflict detected; keeping freshly generated artifact files and continuing."
            git checkout --ours data/events.csv data/events.json data/geocode_cache.json data/url_cache.json data/source_health.json || true
            git add data/events.csv data/events.json data/geocode_cache.json data/url_cache.json data/source_health.json data/runs
            GIT_EDITOR=true git rebase --continue
          fi

          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
